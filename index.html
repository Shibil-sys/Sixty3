<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIXTY3 | The New Standard</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Montserrat:wght@100;300&display=swap" rel="stylesheet">
    <style>
        :root { --purple: #bc13fe; --dark: #000; }
        body { background: var(--dark); color: white; margin: 0; font-family: 'Montserrat', sans-serif; overflow-x: hidden; }

        /* Cinematic Logo */
        .hero {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a0033 0%, #000 70%);
        }

        .logo-container { text-align: center; }

        .sixty3-logo {
            font-family: 'Syncopate', sans-serif;
            font-size: 10vw;
            color: transparent;
            -webkit-text-stroke: 1px var(--purple);
            letter-spacing: 20px;
            position: relative;
            animation: glowText 3s ease-in-out infinite alternate;
        }

        @keyframes glowText {
            from { text-shadow: 0 0 10px var(--purple); opacity: 0.5; }
            to { text-shadow: 0 0 40px var(--purple), 0 0 80px var(--purple); color: white; opacity: 1; }
        }

        /* The Boutique Path */
        .collection-section { padding: 50px 5%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }

        .perfume-card {
            position: relative;
            height: 500px;
            overflow: hidden;
            border: 1px solid #111;
            background: #050505;
        }

        .perfume-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) brightness(50%);
            transition: 0.8s cubic-bezier(0.2, 1, 0.3, 1);
        }

        .perfume-card:hover img {
            filter: grayscale(0%) brightness(100%);
            transform: scale(1.1);
        }

        .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 30px;
            background: linear-gradient(transparent, rgba(188, 19, 254, 0.3));
            transform: translateY(100px);
            transition: 0.5s;
        }

        .perfume-card:hover .card-overlay { transform: translateY(0); }

        .name { font-family: 'Syncopate'; font-size: 1.5rem; color: var(--purple); }
    </style>
</head>
<body>

    <section class="hero">
        <div class="logo-container">
            <div class="sixty3-logo">SIXTY3</div>
            <p style="letter-spacing: 10px; font-weight: 100; margin-top: 20px;">LEGENDARY FRAGRANCE</p>
        </div>
    </section>

    <div class="collection-section">
        <div class="grid" id="excel-data-path">
            </div>
    </div>

    <script>
        const collection = [
            { name: "NOIR 63", price: "$290", img: "https://images.unsplash.com/photo-1594035910387-fea47794261f?auto=format&fit=crop&w=800&q=80" },
            { name: "VIOLET MIST", price: "$210", img: "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?auto=format&fit=crop&w=800&q=80" }
        ];

        const container = document.getElementById('excel-data-path');
        collection.forEach(p => {
            container.innerHTML += `
                <div class="perfume-card">
                    <img src="${p.img}" alt="${p.name}">
                    <div class="card-overlay">
                        <div class="name">${p.name}</div>
                        <div style="font-size: 1.2rem; margin-top: 10px;">${p.price}</div>
                    </div>
                </div>
            `;
        });
    </script>

</body>
</html>
